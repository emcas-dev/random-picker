<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Random Picker</title>
<style>
:root{
  --bg:#f7f5ef; --card:#fffdf9; --ink:#26302a; --muted:#737a72;
  --sage:#8d9b82; --sage-dark:#6f7f68; --coral:#d9826f; --lav:#9a8fa8;
  --blue:#8ca5ad; --gold:#c7a86b; --line:#e5e1d8;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  color:var(--ink); background:var(--bg)
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fbfaf6 0%,#f3f0e8 100%)}
main{max-width:680px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 17px calc(36px + env(safe-area-inset-bottom))}
.app-header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#a9b4a0,#7f8e77);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 4px 12px #65735e24}
h1{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:500;letter-spacing:-.4px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 5px 22px #544b3510;margin-bottom:13px}
label{font-size:11px;letter-spacing:.09em;font-weight:700;color:#858980;display:block;margin:0 0 7px}
select,input,textarea,button{font:inherit}
select,input,textarea{width:100%;border:1px solid #ddd9d0;border-radius:12px;padding:12px;background:#fffdfa;color:var(--ink);outline:none}
select:focus,input:focus,textarea:focus{border-color:#a8b3a0;box-shadow:0 0 0 3px #a8b3a033}
.row{display:flex;gap:9px}.row>*{flex:1}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:650;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.primary{background:var(--coral);color:#fff;font-size:17px;padding:14px;width:100%;box-shadow:0 5px 12px #d9826f2a}
.secondary{background:#eeece5;color:#4f584f}.danger{background:#fff0ed;color:#b34d3b}
.result-card{padding:13px}
.result{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:15px;background:linear-gradient(145deg,#fbf8f1,#f5f2e9);border:1px solid #ebe6dc}
.result-inner{max-width:100%}
.result-kicker{font-size:12px;color:#8a9188;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.result-text{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.1;font-weight:500;letter-spacing:-.6px;overflow-wrap:anywhere}
.result-sub{font-size:12px;color:#92978f;margin-top:13px}
.action-row{margin-top:12px}
h2{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:500;margin:0 0 13px}
.muted{color:#777e76;font-size:13px}.items{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.item{display:flex;align-items:center;gap:8px;padding:10px 11px;background:#f5f3ed;border:1px solid #ebe7de;border-radius:11px}
.item span{flex:1;overflow-wrap:anywhere}.icon{padding:6px 9px;background:transparent;color:#697166;font-size:13px}
.small{font-size:12px;color:#878c84;line-height:1.45;margin-top:8px}
.hidden{display:none}
.section-note{display:flex;align-items:center;gap:8px;color:#858a82;font-size:12px;margin:3px 3px 18px}
.section-note .dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}
</style>
</head>
<body>
<main>
<h1>Random Picker</h1>

<section class="card">
<label for="listSelect">LIST</label>
<div class="row">
<select id="listSelect"></select>
<button class="secondary" id="newList">New list</button>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)">
  <div>
    <div style="font-size:14px;font-weight:650">No repeats</div>
    <div class="small" style="margin-top:2px">Use every item once before starting over.</div>
  </div>
  <label style="margin:0;display:flex;align-items:center;cursor:pointer">
    <input id="noRepeats" type="checkbox" style="width:20px;height:20px;accent-color:var(--sage-dark)">
  </label>
</div>
</section>

<section class="card result-card">
<div class="result" id="result">
  <div class="result-inner">
    <div class="result-kicker">Your pick</div>
    <div class="result-text">Ready when you are.</div>
  </div>
</div>
<div class="action-row"><button class="primary" id="pick">Pick Random</button></div>
</section>

<section class="card">
<h2>Items</h2>
<div class="row">
<input id="newItem" placeholder="Add an item…" autocomplete="off">
<button class="secondary" id="addItem">Add</button>
</div>
<div class="items" id="items"></div>
<p class="muted" id="empty">No items yet. Add some above.</p>
</section>

<section class="card">
<h2>Backup &amp; Restore</h2>
<div class="row">
<button class="secondary" id="export">Export my lists</button>
<button class="secondary" id="importBtn">Import my lists</button>
</div>
<input id="importFile" type="file" accept=".json,application/json" class="hidden">
<p class="small">Export saves all of your lists to a backup file. Importing a backup replaces the lists currently in this app.</p>
</section>

<section class="card">
<h2>Manage list</h2>
<div class="row">
<button class="secondary" id="rename">Rename list</button>
<button class="danger" id="delete">Delete list</button>
</div>
</section>
</main>

<script>
const KEY="randomPickerDataV1";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
  lists:[{id:crypto.randomUUID(),name:"My List",items:[]}],current:null
};
if(!data.current)data.current=data.lists[0].id;
if(typeof data.noRepeats!=="boolean")data.noRepeats=false;
if(!data.remaining)data.remaining={};
const $=id=>document.getElementById(id); const resultText=()=>document.querySelector("#result .result-text");
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function current(){return data.lists.find(x=>x.id===data.current)||data.lists[0]}
function render(){
  current().items.sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base",numeric:true}));
  save();
  const s=$("listSelect"); s.innerHTML="";
  data.lists.forEach(l=>{const o=document.createElement("option");o.value=l.id;o.textContent=l.name;s.appendChild(o)});
  s.value=current().id;
  $("noRepeats").checked=data.noRepeats;
  const box=$("items");box.innerHTML="";
  $("empty").classList.toggle("hidden",current().items.length>0);
  current().items.forEach((item,i)=>{
    const row=document.createElement("div");row.className="item";
    const span=document.createElement("span");span.textContent=item;
    const edit=document.createElement("button");edit.className="icon";edit.textContent="Edit";
    edit.onclick=()=>{const v=prompt("Edit item:",item);if(v!==null&&v.trim()){current().items[i]=v.trim();delete data.remaining[current().id];save();render()}};
    const del=document.createElement("button");del.className="icon";del.textContent="Delete";
    del.onclick=()=>{current().items.splice(i,1);delete data.remaining[current().id];save();render()};
    row.append(span,edit,del);box.append(row);
  });
}
$("newListTop").onclick=()=>$("newList").click();
$("noRepeats").onchange=e=>{
  data.noRepeats=e.target.checked;
  // Starting a fresh no-repeat cycle avoids confusing carryover from a prior mode.
  if(data.noRepeats)data.remaining={};
  save();
};
$("listSelect").onchange=e=>{data.current=e.target.value;resultText().textContent="Ready when you are.";save();render()};
$("pick").onclick=()=>{
  const list=current(),items=list.items;
  if(!items.length){resultText().textContent="Add some items first.";return}

  if(!data.noRepeats){
    resultText().textContent=items[Math.floor(Math.random()*items.length)];
    return;
  }

  let pool=data.remaining[list.id];
  // Rebuild the pool when it is empty, missing, or no longer matches the list.
  const validPool=Array.isArray(pool) && pool.length>0 && pool.every(item=>items.includes(item));
  if(!validPool){
    pool=[...items];
  }
  const index=Math.floor(Math.random()*pool.length);
  const picked=pool.splice(index,1)[0];
  data.remaining[list.id]=pool;
  save();

  resultText().textContent=picked;

  if(pool.length===0){
    setTimeout(()=>{ if(data.noRepeats) resultText().textContent=picked; },0);
  }
};
$("addItem").onclick=()=>{
  const v=$("newItem").value.trim();if(!v)return;
  current().items.push(v);$("newItem").value="";save();$("export").onclick=()=>{
  const backup={version:1,exportedAt:new Date().toISOString(),lists:data.lists,current:data.current};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="random-picker-backup.json";
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const backup=JSON.parse(reader.result);
      if(!backup||!Array.isArray(backup.lists)||!backup.lists.length)throw new Error();
      const valid=backup.lists.every(l=>l&&typeof l.id==="string"&&typeof l.name==="string"&&Array.isArray(l.items)&&l.items.every(i=>typeof i==="string"));
      if(!valid)throw new Error();
      if(!confirm("Import this backup? Your current lists will be replaced."))return;
      data={lists:backup.lists,current:backup.current,noRepeats:data.noRepeats,remaining:{}};
      if(!data.lists.some(l=>l.id===data.current))data.current=data.lists[0].id;
      data.lists.forEach(l=>l.items.sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base",numeric:true})));
      save();resultText().textContent="Backup restored.";render();
    }catch(err){alert("That backup file could not be imported.");}
    e.target.value="";
  };
  reader.readAsText(file);
};

render();$("newItem").focus();
};
$("newItem").onkeydown=e=>{if(e.key==="Enter")$("addItem").click()};
$("newList").onclick=()=>{
  const name=prompt("Name your new list:");
  if(!name||!name.trim())return;
  const l={id:crypto.randomUUID(),name:name.trim(),items:[]};data.lists.push(l);data.current=l.id;save();render();
};
$("rename").onclick=()=>{
  const l=current(),name=prompt("Rename list:",l.name);
  if(name&&name.trim()){l.name=name.trim();save();render()}
};
$("delete").onclick=()=>{
  if(data.lists.length===1){alert("You need to keep at least one list.");return}
  if(!confirm(`Delete "${current().name}"?`))return;
  const i=data.lists.findIndex(x=>x.id===data.current);data.lists.splice(i,1);data.current=data.lists[Math.max(0,i-1)].id;
  resultText().textContent="Ready when you are.";save();render();
};
render();
</script>
</body>
</html>
